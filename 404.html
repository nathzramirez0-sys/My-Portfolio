<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Page not found · Jonathan Cercenina Ramirez</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#111418">
  <!-- GitHub Pages serves this for any missing address, at any depth, so every link is absolute -->
  <link rel="icon" href="/My-Portfolio/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300..600&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    :root {
      color-scheme: dark;
      --ground: #111418;
      --line: #222831;
      --line-strong: #313844;
      --orbit: #3a4350;
      --node: #c7cdd6;
      --text: #e3e6ea;
      --muted: #939ba7;
      --faint: #828a97;
      --accent: #8fcbe0;
      --accent-hover: #a9d8ea;
      --accent-ink: #0b1a20;
      --font-body: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: grid; place-items: center;
      padding-inline: clamp(16px, 5vw, 48px);
      background: radial-gradient(ellipse 60% 55% at 70% 50%, #171c22, transparent 70%), var(--ground);
      color: var(--text);
      font-family: var(--font-body);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    main {
      width: 100%; max-width: 980px;
      display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 360px);
      align-items: center; gap: clamp(24px, 6vw, 72px);
      padding-block: 48px;
    }
    .code { font: 500 0.75rem/1 var(--font-mono); letter-spacing: 0.16em; color: var(--accent); text-transform: uppercase; }
    h1 { margin: 16px 0 0; font-size: clamp(2rem, 1.4rem + 2.6vw, 3.2rem); font-weight: 300; line-height: 1.06; letter-spacing: -0.03em; text-wrap: balance; }
    p { margin: 16px 0 0; max-width: 34em; color: var(--muted); font-size: 1.0625rem; }
    .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; margin-top: 28px; }
    .btn {
      display: inline-flex; align-items: center; height: 42px; padding-inline: 18px;
      border-radius: 8px; background: var(--accent); color: var(--accent-ink);
      font: 500 0.9375rem/1 var(--font-body); text-decoration: none;
    }
    .btn:hover { background: var(--accent-hover); }
    .links { display: flex; gap: 18px; }
    .links a { color: var(--muted); text-underline-offset: 4px; }
    .links a:hover { color: var(--accent); }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

    /* a small orrery with one point drifted off its ring */
    .map { width: 100%; height: auto; }
    .map ellipse { fill: none; stroke: var(--orbit); stroke-width: 1.2; }
    .map .core { fill: var(--text); }
    .map .dot { fill: var(--node); opacity: 0.55; }
    .map .lost { fill: var(--accent); }
    .map .trail { fill: none; stroke: var(--accent); stroke-width: 1.2; stroke-dasharray: 3 5; opacity: 0.6; }
    .spin { transform-origin: 180px 150px; animation: spin 60s linear infinite; }
    .drift { animation: drift 6s ease-in-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes drift { 50% { transform: translate(6px, -8px); } }
    @media (prefers-reduced-motion: reduce) { .spin, .drift { animation: none; } }

    @media (max-width: 720px) {
      main { grid-template-columns: minmax(0, 1fr); }
      .map { max-width: 320px; order: -1; }
    }
  </style>
</head>
<body>
  <main>
    <div>
      <span class="code">404 · Not found</span>
      <h1>This page isn't on the map.</h1>
      <p>The link may be old or mistyped. Everything I've built is on the main page: my thesis, six more projects, and how to reach me.</p>
      <div class="actions">
        <a class="btn" href="/My-Portfolio/">Back to the portfolio</a>
        <nav class="links" aria-label="Sections">
          <a href="/My-Portfolio/#work">Work</a>
          <a href="/My-Portfolio/#projects">Projects</a>
          <a href="/My-Portfolio/#contact">Contact</a>
        </nav>
      </div>
    </div>
    <svg class="map" viewBox="0 0 360 300" aria-hidden="true">
      <g class="spin">
        <ellipse cx="180" cy="150" rx="46" ry="19"></ellipse>
        <ellipse cx="180" cy="150" rx="86" ry="36"></ellipse>
        <ellipse cx="180" cy="150" rx="126" ry="53"></ellipse>
        <ellipse cx="180" cy="150" rx="166" ry="70"></ellipse>
        <circle class="dot" cx="226" cy="150" r="3"></circle>
        <circle class="dot" cx="120" cy="178" r="3"></circle>
        <circle class="dot" cx="290" cy="126" r="3"></circle>
        <circle class="dot" cx="70" cy="132" r="2.5"></circle>
        <circle class="dot" cx="200" cy="218" r="2.5"></circle>
      </g>
      <circle class="core" cx="180" cy="150" r="6"></circle>
      <path class="trail" d="M 300 108 C 312 80, 300 58, 286 46"></path>
      <g class="drift"><circle class="lost" cx="284" cy="42" r="6"></circle></g>
    </svg>
  </main>
</body>
</html>
